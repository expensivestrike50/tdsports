# Refreshes the aggregated football news for the hosted site every 30 minutes.
# The result goes to the news-data branch (not main), so it never conflicts with pushes to
# main; the app reads it from raw.githubusercontent.com.
name: Refresh news

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: true

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aggregate news
        run: python3 tools/fetch-news.py
      - name: Publish to the news-data branch
        run: |
          mkdir /tmp/out && cp news.json /tmp/out/
          cd /tmp/out
          git init -q -b news-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -q -m "Update news"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" news-data
